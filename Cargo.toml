[package]
name = "reyer"
version = "2.1.1"
edition = "2021"
description = "Video and audio player for Windows with a Liquid Glass interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/reyjendiz/Reyer"
build = "build.rs"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
glow = "0.16"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
lofty = "0.22"
rfd = "0.15"
tiny-skia = "0.11"
svgtypes = "0.15"
arboard = { version = "3", default-features = false }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry",
    "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
